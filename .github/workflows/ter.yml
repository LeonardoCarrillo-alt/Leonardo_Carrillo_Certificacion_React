 name: vite React check
 on: 
    push:
    workflow_dispatch: 
 jobs: 
   qa: 
     runs-on: ubuntu-latest
     steps:
       - name: Descargar código
         uses: actions/checkout@v4
       - name: ver carpetas
         run: pwd
       - name: ver archivos
         run: ls -la
       - name: instalar node
         uses: actions/setup-node@v4
         with: 
           node-version: 22
       - name: ejecutar build en la carpeta del proyecto
         run: npx vite build
         working-directory: archivos_clases/tres-en-raya